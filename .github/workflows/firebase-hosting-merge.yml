name: Deploy to Firebase production

on:
  push:
    branches:
      - main

concurrency:
  group: firebase-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Functions dependencies
        run: npm ci --prefix functions

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: brain-3bc3a
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BRAIN_3BC3A }}

      - name: Deploy Hosting and Cloud Functions
        run: npx --yes firebase-tools@latest deploy --only hosting,functions --project brain-3bc3a
