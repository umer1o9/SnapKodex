<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600" viewBox="0 0 600 600" fill="none">
  <defs>
    <radialGradient id="cyan" cx="30%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#35d4ea" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#35d4ea" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="purple" cx="70%" cy="60%" r="55%">
      <stop offset="0%" stop-color="#ab54ec" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#ab54ec" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
  </defs>
  <circle cx="200" cy="180" r="200" fill="url(#cyan)" filter="url(#blur)"/>
  <circle cx="400" cy="360" r="180" fill="url(#purple)" filter="url(#blur)"/>
  <circle cx="300" cy="280" r="120" fill="url(#cyan)" fill-opacity="0.2" filter="url(#blur)"/>
</svg>
